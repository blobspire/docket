{{define "search.html"}}{{template "head" .}}
<main class="main solo" id="main" data-label="Search">
  <div class="pg">
  <div class="mh"><div><h1>Search</h1></div></div>
  <form class="searchbar" method="get" action="/search">
    <input id="q" name="q" value="{{.Query}}" placeholder="Questions, answers, reasons: 'sept7', 'basket demo', 'why did we'" autofocus>
    <button class="sb pri" type="submit">Search</button>
  </form>
  {{if .Query}}<p class="muted small">{{len .Rows}} result{{if ne (len .Rows) 1}}s{{end}}</p>{{end}}
  {{if .Rows}}<ol class="rows">{{range .Rows}}{{template "row" .}}{{end}}</ol>{{end}}
  </div>
</main>
{{template "foot" .}}{{end}}
