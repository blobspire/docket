# ~/.config/docket/docket.toml on the server (the always-on machine).
# This file is personal: keep it out of version control.

person = "Sam"                      # how answers and agents refer to you
listen = "127.0.0.1:7788"           # serve it on your tailnet with `tailscale serve`
public_url = "https://server.your-tailnet.ts.net"   # used for links in phone pushes
timezone = "America/New_York"
system_project = "admin"            # where docket's own health items go (default "system")
# allow_logins = ["you@example.com"]  # optional: Tailscale-User-Login allowlist
# backup_days = 7                   # nightly gzipped database backups kept in <data_dir>/backups (0 = off)

[ntfy]
server = "https://ntfy.sh"
topic = "pick-a-long-random-topic"
# token = "tk_..."                  # or keep secrets in a file:
# env_file = "~/.config/docket/ntfy.env"   # NTFY_SERVER / NTFY_TOPIC / NTFY_TOKEN
# Only act-now items push, at any hour.

# The server itself.
[[machine]]
name = "server"
mode = "local"

# A machine the server can SSH to but that can't reach the server.
[[machine]]
name = "lab"
mode = "pull"
ssh = "lab"                         # anything `ssh lab` reaches
interval = "2m"

# A laptop that sleeps: it runs `docket sync --server server` itself.
[[machine]]
name = "laptop"
mode = "push"

# A lead: one long-running agent per area of work.
# [[lead]]
# name = "website"
# machine = "laptop"
# dir = "~/code/site"
# project = "website"               # the project its items belong to (default: its name)
# match_dir = true
# schedule = ["daily@09:30"]
# wake_on = ["job_stale", "job_done"]

# Ideas: dictate (or type) an idea; an agent researches it and proposes a plan.
# See docs/ideas.md. Without [transcribe] url, ideas can only be typed.
# [transcribe]
# url = "http://127.0.0.1:8178/inference"   # whisper.cpp's whisper-server (deploy/systemd/whisper.service)
# vocabulary = ["DAgger", "FR5"]           # words to spell right; project names are added on their own
# said_as = { cwant = "quant" }            # names speech-to-text can't spell, and how they sound
# keep_audio = "90d"
#
# [ideas]
# model = "claude-opus-5-5"                # research sessions and the router
# max_running = 4                          # sessions researching or building at once
# clone_dir = "~/code/git"                 # where repositories are cloned on this server when their laptop sleeps

# Email triage: docket sorts your mail three times a day, drafts replies,
# and digests what's worth reading. See docs/email.md. Passwords live in
# files only you can read (chmod 600), never in this file.
# [email]
# schedule = ["daily@08:00", "daily@12:30", "daily@17:30"]
# triage_model = "claude-sonnet-5-5"
# draft_model = "claude-opus-5-5"
# max_running = 4                   # drafts written at once; the rest wait
# digest_days = 3
# keep_days = 30                    # message bodies kept this long
# voice = "~/.claude/skills/draft-email/SKILL.md"   # your writing guide
#
# [[email.account]]                 # Gmail, with an app password
# name = "gmail"
# label = "Gmail"
# address = "you@gmail.com"
# display_name = "Your Name"
# imap = "imap.gmail.com:993"
# smtp = "smtp.gmail.com:587"
# password_file = "~/.config/docket/secrets/gmail-app-password"
#
# [[email.account]]                 # Microsoft 365 through DavMail on this machine
# name = "work"
# label = "Work"
# address = "you@example.edu"
# imap = "127.0.0.1:1143"
# smtp = "127.0.0.1:1025"
# security = "plain"                # only allowed for a gateway on loopback
# password_file = "~/.config/docket/secrets/davmail-password"
# signature_html = "~/.config/docket/signatures/work/signature.html"
# signature_text = "~/.config/docket/signatures/work/signature.txt"
# signin_log = "~/.local/state/davmail/davmail.out.log"   # shows DavMail's sign-in code on docket
# web = "outlook"
